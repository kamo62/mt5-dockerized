version: "3.8"

services:
  linux-mt5:
    build:
      context: .
    image: linux-mt5:latest
    platform: linux/amd64
    container_name: linux-mt5
    init: true
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    restart: unless-stopped
    ports:
      - "${APP_PORT:-17300}:3000"
      - "${NOVNC_PORT:-17080}:6080"
    environment:
      PORT: "3000"
      DISPLAY_ID: ":99"
      DESKTOP_WIDTH: "1920"
      DESKTOP_HEIGHT: "1080"
      MT5_DATA_DIR: "/data"
      PUBLIC_NOVNC_URL: "${PUBLIC_NOVNC_URL:-http://192.168.0.100:17080/vnc.html?autoconnect=1&resize=scale&path=websockify}"
      WEBSOCKIFY_HEARTBEAT_SECONDS: "30"
      AUTO_LAUNCH_MT5: "true"
      MT5_INSTALLER_URL: "${MT5_INSTALLER_URL:-https://download.terminal.free/cdn/web/12040/mt5/hfmarketssa5setup.exe}"
    volumes:
      - "${MT5_DATA_DIR:-/home/kamo/linux-mt5-data}:/data"
